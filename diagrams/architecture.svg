<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1300" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="40" y="42" font-size="26" font-weight="800" fill="#232F3E">aws</text>
  <text x="95" y="42" font-size="20" font-weight="600" fill="#232F3E">SecureWebLab — Segmented Web Platform</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">us-east-1 (N. Virginia)</text>

  <!-- Internet cloud -->
  <g>
    <ellipse cx="590" cy="55" rx="70" ry="26" fill="#EDEFF2" stroke="#8A97A6" stroke-width="1.5"/>
    <ellipse cx="545" cy="60" rx="30" ry="18" fill="#EDEFF2" stroke="#8A97A6" stroke-width="1.5"/>
    <ellipse cx="635" cy="60" rx="30" ry="18" fill="#EDEFF2" stroke="#8A97A6" stroke-width="1.5"/>
    <text x="590" y="60" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Internet</text>
  </g>

  <!-- Arrow: Internet -> IGW -->
  <line x1="590" y1="88" x2="590" y2="128" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="90" y="130" width="880" height="560" rx="10" fill="#F4FBF2" stroke="#1D8102" stroke-width="3"/>
  <text x="110" y="155" font-size="15" font-weight="700" fill="#1D8102">VPC — SecureWebLab-VPC (10.0.0.0/16)</text>

  <!-- IGW icon -->
  <g>
    <circle cx="590" cy="180" r="24" fill="#FFFFFF" stroke="#7B42BC" stroke-width="3"/>
    <circle cx="590" cy="180" r="9" fill="#7B42BC"/>
    <text x="590" y="222" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">Internet Gateway</text>
    <text x="590" y="236" font-size="11" fill="#6B7280" text-anchor="middle">SecureWebLab-IGW · Attached</text>
  </g>

  <!-- Arrow IGW -> public subnet -->
  <line x1="590" y1="204" x2="590" y2="270" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Public subnet -->
  <rect x="120" y="270" width="380" height="380" rx="8" fill="#EAF4FF" stroke="#0973B9" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="135" y="295" font-size="13" font-weight="700" fill="#0973B9">Public Subnet — 10.0.1.0/24</text>

  <!-- NAT Gateway icon -->
  <g>
    <rect x="180" y="330" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#0973B9" stroke-width="2"/>
    <text x="250" y="355" font-size="12" font-weight="700" fill="#0973B9" text-anchor="middle">NAT Gateway</text>
    <text x="250" y="371" font-size="10.5" fill="#374151" text-anchor="middle">SecureWebLab-NATGW</text>
    <text x="250" y="384" font-size="9.5" fill="#9CA3AF" text-anchor="middle">created only during active sessions</text>
  </g>

  <!-- Public route table note -->
  <rect x="180" y="410" width="290" height="46" rx="6" fill="#FFFFFF" stroke="#0973B9" stroke-width="1.2"/>
  <text x="325" y="430" font-size="10.5" fill="#374151" text-anchor="middle">SecureWebLab-Public-RT</text>
  <text x="325" y="445" font-size="10.5" fill="#374151" text-anchor="middle">0.0.0.0/0 → Internet Gateway</text>

  <!-- Elastic IP note -->
  <rect x="180" y="470" width="290" height="42" rx="6" fill="#FFFFFF" stroke="#0973B9" stroke-width="1.2"/>
  <text x="325" y="488" font-size="10.5" fill="#374151" text-anchor="middle">Elastic IP (attached to NAT GW)</text>
  <text x="325" y="502" font-size="9.5" fill="#9CA3AF" text-anchor="middle">released after each session</text>

  <!-- Private subnet -->
  <rect x="550" y="270" width="380" height="380" rx="8" fill="#FFF3EA" stroke="#D86613" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="565" y="295" font-size="13" font-weight="700" fill="#D86613">Private Subnet — 10.0.2.0/24</text>

  <!-- Security Group padlock -->
  <g>
    <rect x="610" y="325" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#D13212" stroke-width="1.5"/>
    <path d="M628 345 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#D13212" stroke-width="2.5"/>
    <rect x="623" y="345" width="24" height="18" rx="3" fill="#D13212"/>
    <text x="665" y="348" font-size="11.5" font-weight="700" fill="#374151">SecureWebLab-SG</text>
    <text x="665" y="363" font-size="10" fill="#6B7280">0 inbound rules</text>
  </g>

  <!-- EC2 instance icon -->
  <g>
    <rect x="610" y="395" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#D86613" stroke-width="2"/>
    <rect x="628" y="412" width="34" height="34" rx="4" fill="#D86613"/>
    <line x1="633" y1="420" x2="657" y2="420" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="633" y1="428" x2="657" y2="428" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="633" y1="436" x2="657" y2="436" stroke="#FFFFFF" stroke-width="2"/>
    <text x="676" y="422" font-size="11.5" font-weight="700" fill="#374151">SecureWebLab-Server</text>
    <text x="676" y="437" font-size="10" fill="#6B7280">t3.micro · Amazon Linux 2023</text>
    <text x="676" y="452" font-size="10" fill="#6B7280">No public IPv4 address</text>
    <text x="676" y="467" font-size="10" fill="#6B7280">No SSH · No key pair</text>
  </g>

  <!-- Private route table note -->
  <rect x="610" y="500" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#D86613" stroke-width="1.2"/>
  <text x="740" y="520" font-size="10.5" fill="#374151" text-anchor="middle">SecureWebLab-Private-RT</text>
  <text x="740" y="535" font-size="10.5" fill="#374151" text-anchor="middle">0.0.0.0/0 → NAT Gateway</text>

  <!-- Arrow NAT -> EC2 (outbound only) -->
  <line x1="320" y1="360" x2="605" y2="440" stroke="#0973B9" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowblue)"/>
  <text x="450" y="390" font-size="10.5" fill="#0973B9" text-anchor="middle" transform="rotate(9 450 390)">outbound-only</text>

  <!-- Blocked path: Internet -> Private subnet directly -->
  <line x1="640" y1="55" x2="740" y2="260" stroke="#D13212" stroke-width="2" stroke-dasharray="3,5"/>
  <circle cx="740" cy="260" r="12" fill="none" stroke="#D13212" stroke-width="2.5"/>
  <line x1="732" y1="252" x2="748" y2="268" stroke="#D13212" stroke-width="2.5"/>
  <line x1="748" y1="252" x2="732" y2="268" stroke="#D13212" stroke-width="2.5"/>
  <text x="800" y="200" font-size="10.5" fill="#D13212" text-anchor="middle">no direct</text>
  <text x="800" y="213" font-size="10.5" fill="#D13212" text-anchor="middle">inbound path</text>

  <!-- IAM Role box (outside VPC, right side) -->
  <rect x="1010" y="260" width="240" height="90" rx="8" fill="#FFF8E6" stroke="#B8860B" stroke-width="2"/>
  <text x="1130" y="282" font-size="12" font-weight="700" fill="#8A6D1D" text-anchor="middle">IAM Role</text>
  <text x="1130" y="299" font-size="10.5" fill="#374151" text-anchor="middle">SecureWebLab-SSM-Role</text>
  <text x="1130" y="314" font-size="9.5" fill="#6B7280" text-anchor="middle">AmazonSSMManagedInstanceCore</text>
  <text x="1130" y="328" font-size="9.5" fill="#6B7280" text-anchor="middle">attached to instance</text>

  <!-- Arrow IAM -> EC2 -->
  <path d="M1010 305 C 930 305, 900 440, 872 440" fill="none" stroke="#B8860B" stroke-width="2" marker-end="url(#arrowgold)"/>

  <!-- Admin / Session Manager -->
  <g>
    <circle cx="1130" cy="410" r="18" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
    <circle cx="1130" cy="403" r="6" fill="#232F3E"/>
    <path d="M1118 420 q12 -12 24 0" fill="none" stroke="#232F3E" stroke-width="2"/>
    <text x="1130" y="445" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">You (Admin)</text>
  </g>
  <path d="M1130 428 C 1130 470, 950 470, 872 460" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="480" font-size="9.5" fill="#374151" text-anchor="middle">Session Manager — IAM-authenticated,</text>
  <text x="1000" y="493" font-size="9.5" fill="#374151" text-anchor="middle">zero open inbound ports</text>

  <!-- S3 bucket box -->
  <g>
    <rect x="1010" y="520" width="240" height="95" rx="8" fill="#FEF0EC" stroke="#E05243" stroke-width="2"/>
    <path d="M1030 545 h30 v8 c0 4 -7 7 -15 7 s-15 -3 -15 -7 z" fill="#E05243"/>
    <path d="M1030 545 c0 -4 7 -7 15 -7 s15 3 15 7" fill="none" stroke="#E05243" stroke-width="1.5"/>
    <text x="1130" y="570" font-size="12" font-weight="700" fill="#B8331F" text-anchor="middle">Amazon S3</text>
    <text x="1130" y="586" font-size="10" fill="#374151" text-anchor="middle">secureweblab-status-... </text>
    <text x="1130" y="600" font-size="9.5" fill="#6B7280" text-anchor="middle">static website · public read only</text>
  </g>

  <!-- Arrow Internet -> S3 -->
  <path d="M660 60 C 950 30, 1200 200, 1130 518" fill="none" stroke="#E05243" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="1030" y="130" font-size="10.5" fill="#B8331F" text-anchor="middle">public GET (bucket policy)</text>

  <!-- CloudTrail box -->
  <rect x="330" y="720" width="360" height="80" rx="8" fill="#F0F0FA" stroke="#5A4FCF" stroke-width="2"/>
  <text x="510" y="745" font-size="12.5" font-weight="700" fill="#3F3593" text-anchor="middle">AWS CloudTrail</text>
  <text x="510" y="762" font-size="10.5" fill="#374151" text-anchor="middle">Logs every StartSession event —</text>
  <text x="510" y="777" font-size="10.5" fill="#374151" text-anchor="middle">identity, timestamp, target instance</text>

  <!-- Arrow session manager path -> cloudtrail -->
  <path d="M1000 480 C 900 650, 700 700, 690 730" fill="none" stroke="#5A4FCF" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowpurple)"/>

  <!-- Legend / Key box -->
  <rect x="1010" y="650" width="240" height="150" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1030" y="672" font-size="12" font-weight="700" fill="#374151">Key</text>
  <line x1="1030" y1="690" x2="1060" y2="690" stroke="#1D8102" stroke-width="3"/>
  <text x="1068" y="694" font-size="10" fill="#374151">VPC boundary</text>
  <line x1="1030" y1="710" x2="1060" y2="710" stroke="#0973B9" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="1068" y="714" font-size="10" fill="#374151">Public subnet</text>
  <line x1="1030" y1="730" x2="1060" y2="730" stroke="#D86613" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="1068" y="734" font-size="10" fill="#374151">Private subnet</text>
  <line x1="1030" y1="750" x2="1060" y2="750" stroke="#D13212" stroke-width="3" stroke-dasharray="3,5"/>
  <text x="1068" y="754" font-size="10" fill="#374151">Blocked / no route</text>
  <line x1="1030" y1="770" x2="1060" y2="770" stroke="#232F3E" stroke-width="2"/>
  <text x="1068" y="774" font-size="10" fill="#374151">Traffic flow</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0973B9"/>
    </marker>
    <marker id="arrowgold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#B8860B"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#E05243"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5A4FCF"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="40" y="870" font-size="10" fill="#9CA3AF">SecureWebLab — Segmented Web Platform on AWS · us-east-1 · Built phase by phase, documented as-built</text>
</svg>
